name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      package_channel:
        description: Candidate to build after all tests pass
        required: true
        type: choice
        options:
          - pre-release
          - release

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  package:
    name: VSIX artifact
    needs: [checks, unit, webview, integration, ui]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package selected channel
        env:
          PACKAGE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.package_channel || 'development' }}
        run: npm run package:ci -- "$PACKAGE_CHANNEL"
      - name: Upload VSIX and build identity
        uses: actions/upload-artifact@v7
        with:
          name: your-turn-${{ github.event_name == 'workflow_dispatch' && inputs.package_channel || 'development' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/packages/
          if-no-files-found: error
          retention-days: 14

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install containment and display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap xvfb xauth
      - run: npm ci
      - name: Run unit suite
        run: npm run test:unit:only
      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-results
          path: test-results/in-process/
          if-no-files-found: warn
          retention-days: 14

  webview:
    name: Webview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run webview suite
        run: npm run test:webview:only
      - name: Upload webview test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: webview-results
          path: test-results/in-process/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install editor and display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libasound2t64 libatk-bridge2.0-0 libgbm1 libgtk-3-0 libnss3
      - run: npm ci
      - name: Run integration suite sequentially
        run: npm run test:integration:only -- --jobs 1 --display xvfb
      - name: Upload integration reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: test-results/integration/results/
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: Desktop UI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install containment, editor and display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap xvfb xauth libasound2t64 libatk-bridge2.0-0 libgbm1 libgtk-3-0 libnss3
      - run: npm ci
      - name: Run desktop UI suite
        run: npm run test:ui:only
      - name: Upload desktop UI reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-results
          path: |
            test-results/ui/
            test-results/ui-report/
          if-no-files-found: warn
          retention-days: 14
